options:
  platform: psp
  compiler: GCC
  basename: libstory
  base_path: ..
  target_path: build/elf/libstory.elf
  asm_path: asm/libstory
  asset_path: assets/libstory
  src_path: src/libstory
  ld_script_path: build/libstory.ld
  symbol_addrs_path: build/libstory.syms.txt
  undefined_funcs_auto_path: build/libstory.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/libstory.undefined_syms_auto.txt
  find_file_boundaries: False
  migrate_rodata_to_functions: False
  section_order: [".text", ".sceStub.text", ".data", ".rodata", ".bss"]
  ld_dependencies: False
  ld_align_section_vram_end: False
  ld_align_segment_start: 0
segments:
  - [0x0, bin, header]
  - name: libstory
    type: code
    start: 0x60
    vram: 0x8804000
    bss_size: 0x2AE180
    subalign: 4
    subsegments:
      - [0x60, asm, text]
      - [0x13EC4, asm, sceStub_text]
      - [0x16724, bin, lib_ent_top]
      - [0x16728, bin, lib_ent]
      - [0x16748, bin, lib_ent_btm]
      - [0x1674C, bin, lib_stub_top]
      - [0x16750, bin, lib_stub]
      - [0x16858, bin, lib_stub_btm]
      - [0x1685C, bin, rodata_sceModuleInfo]
      - [0x16890, bin, rodata_sceResident]
      - [0x16978, bin, rodata_sceNid]
      - [0x17DA8, bin, rodata_sceVstub]
      - [0x17DC8, data, data]
      - { start: 0x19A70, type: bss, vram: 0x881DA10, name: bss }
  - [0x19A70]

