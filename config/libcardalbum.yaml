  symbol_addrs_path: build/libcardalbum.syms.txt
  undefined_funcs_auto_path: build/libcardalbum.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/libcardalbum.undefined_syms_auto.txt
  find_file_boundaries: False
  migrate_rodata_to_functions: False
