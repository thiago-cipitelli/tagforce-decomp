    type: code
    start: 0x60
    vram: 0x8804000
    bss_size: 0x1470
    subalign: 4
    subsegments:
      - [0x60, asm, text]
      - [0x5B90, asm, sceStub_text]
      - [0x8278, bin, lib_ent_top]
      - [0x827C, bin, lib_ent]
      - [0x829C, bin, lib_ent_btm]
