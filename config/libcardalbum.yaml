      - [0x82A4, bin, lib_stub]
      - [0x82BC, bin, lib_stub_btm]
      - [0x82C0, bin, rodata_sceModuleInfo]
      - [0x82F4, bin, rodata_sceResident]
      - [0x8330, bin, rodata_sceNid]
      - [0x96A4, bin, rodata_sceVstub]
      - [0x96C4, data, data]
      - { start: 0x9D80, type: bss, vram: 0x880DD20, name: bss }
  - [0x9D80]

