options:
  platform: psp
  compiler: GCC
  basename: libdeck
  base_path: ..
  target_path: build/elf/libdeck.elf
  asm_path: asm/libdeck
  asset_path: assets/libdeck
  src_path: src/libdeck
  ld_script_path: build/libdeck.ld
  symbol_addrs_path: build/libdeck.syms.txt
  undefined_funcs_auto_path: build/libdeck.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/libdeck.undefined_syms_auto.txt
  find_file_boundaries: False
  migrate_rodata_to_functions: False
  section_order: [".text", ".sceStub.text", ".data", ".rodata", ".bss"]
  ld_dependencies: False
  ld_align_section_vram_end: False
  ld_align_segment_start: 0
segments:
  - [0x0, bin, header]
  - name: libdeck
    type: code
    start: 0x60
    vram: 0x8804000
    bss_size: 0xDAF4C0
    subalign: 4
    subsegments:
      - [0x60, asm, text]
      - [0x1A8D0, asm, sceStub_text]
      - [0x1CFF0, bin, lib_ent_top]
      - [0x1CFF4, bin, lib_ent]
      - [0x1D014, bin, lib_ent_btm]
      - [0x1D018, bin, lib_stub_top]
      - [0x1D01C, bin, lib_stub]
      - [0x1D070, bin, lib_stub_btm]
      - [0x1D074, bin, rodata_sceModuleInfo]
      - [0x1D0A8, bin, rodata_sceResident]
      - [0x1D0F8, bin, rodata_sceNid]
      - [0x1E520, bin, rodata_sceVstub]
      - [0x1E540, data, data]
      - { start: 0x1F9B0, type: bss, vram: 0x8823950, name: bss }
  - [0x1F9B0]

