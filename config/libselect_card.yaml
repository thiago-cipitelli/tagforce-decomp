options:
  platform: psp
  compiler: GCC
  basename: libselect_card
  base_path: ..
  target_path: build/elf/libselect_card.elf
  asm_path: asm/libselect_card
  asset_path: assets/libselect_card
  src_path: src/libselect_card
  ld_script_path: build/libselect_card.ld
  symbol_addrs_path: build/libselect_card.syms.txt
  undefined_funcs_auto_path: build/libselect_card.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/libselect_card.undefined_syms_auto.txt
  find_file_boundaries: False
  migrate_rodata_to_functions: False
  section_order: [".text", ".sceStub.text", ".data", ".rodata", ".bss"]
  ld_dependencies: False
  ld_align_section_vram_end: False
  ld_align_segment_start: 0
segments:
