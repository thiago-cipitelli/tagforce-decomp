    type: code
    start: 0x60
    vram: 0x8804000
    bss_size: 0xF50
    subalign: 4
    subsegments:
      - [0x60, asm, text]
      - [0x12E34, asm, sceStub_text]
      - [0x1551C, bin, lib_ent_top]
      - [0x15520, bin, lib_ent]
      - [0x15540, bin, lib_ent_btm]
      - [0x15544, bin, lib_stub_top]
      - [0x15548, bin, lib_stub]
      - [0x15560, bin, lib_stub_btm]
      - [0x15564, bin, rodata_sceModuleInfo]
      - [0x15598, bin, rodata_sceResident]
      - [0x155DC, bin, rodata_sceNid]
      - [0x16950, bin, rodata_sceVstub]
      - [0x16970, data, data]
      - { start: 0x175A0, type: bss, vram: 0x881B540, name: bss }
  - [0x175A0]

