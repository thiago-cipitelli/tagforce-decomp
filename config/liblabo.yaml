options:
  platform: psp
  compiler: GCC
  basename: liblabo
  base_path: ..
  target_path: build/elf/liblabo.elf
  asm_path: asm/liblabo
  asset_path: assets/liblabo
  src_path: src/liblabo
  ld_script_path: build/liblabo.ld
  symbol_addrs_path: build/liblabo.syms.txt
  undefined_funcs_auto_path: build/liblabo.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/liblabo.undefined_syms_auto.txt
  find_file_boundaries: False
  migrate_rodata_to_functions: False
  section_order: [".text", ".sceStub.text", ".data", ".rodata", ".bss"]
  ld_dependencies: False
  ld_align_section_vram_end: False
  ld_align_segment_start: 0
segments:
  - [0x0, bin, header]
  - name: liblabo
    type: code
    start: 0x60
    vram: 0x8804000
    bss_size: 0x100090
    subalign: 4
    subsegments:
      - [0x60, asm, text]
      - [0x1558, asm, sceStub_text]
      - [0x3D30, bin, lib_ent_top]
      - [0x3D34, bin, lib_ent]
      - [0x3D54, bin, lib_ent_btm]
      - [0x3D58, bin, lib_stub_top]
      - [0x3D5C, bin, lib_stub]
      - [0x3E14, bin, lib_stub_btm]
      - [0x3E18, bin, rodata_sceModuleInfo]
      - [0x3E4C, bin, rodata_sceResident]
      - [0x3EE4, bin, rodata_sceNid]
      - [0x52D0, bin, rodata_sceVstub]
      - [0x52F0, data, data]
      - { start: 0x6660, type: bss, vram: 0x880A600, name: bss }
  - [0x6660]

